<!DOCTYPE html> <!-- Declares document type as HTML5 -->
<html lang="en"> <!-- Root element specifying English language -->
<head> <!-- Head section for page metadata, title, and CSS styles -->
    <meta charset="UTF-8"> <!-- Sets character encoding standard to UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures proper responsive scaling on mobile devices -->
    <title>mchess ai</title> <!-- Title shown on the browser tab -->
    <style>
        :root { /* Defines global CSS variable color themes */
            --bg-color: #0b0f19; /* Deep futuristic dark background fill */
            --panel-bg: #131b2e; /* Dark slate panel container background */
            --border-color: rgba(255, 255, 255, 0.08); /* Sleek translucent border outline */
            --accent-green: #10b981; /* Neon green highlight for confirm actions */
            --accent-blue: #3b82f6; /* Electric blue highlight color */
            --accent-gold: #f59e0b; /* Golden shop button color */
            --text-main: #f8fafc; /* Primary bright white text color */
            --text-muted: #94a3b8; /* Subdued gray-blue text color */
        }

        body { /* Global body element style layout rules */
            margin: 0;
            background: radial-gradient(circle at center, #1e293b 0%, var(--bg-color) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto; /* Allows safe scrolling if zoomed in */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
            color: var(--text-main);
            padding: 10px;
            box-sizing: border-box;
        }

        .screen { /* Container layout class for each app screen view */
            display: none; /* Hides all screens by default */
            width: 100%;
            max-width: 540px;
            min-height: 90vh;
            max-height: 95vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            overflow-y: auto; /* Prevents button clipping during zoom-ins */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(59, 130, 246, 0.05);
        }

        .screen.active { /* Makes the target screen visible when active */
            display: flex;
        }

        #game-screen { /* Game screen specific container layout */
            align-items: center;
            justify-content: flex-start;
        }

        /* Outer Frame Container Styling for Board & External UI */
        .board-outer-frame {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            padding: 55px 15px 15px 15px; /* Leaves padding at the top for external HUD elements */
            box-sizing: border-box;
        }

        /* Container holding top UI elements (Turn Badge & XP Bar) side-by-side outside the board */
        .external-hud-header {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* External Turn Indicator Panel */
        #external-turn-badge {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 8px;
            padding: 8px 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            font-size: 11px;
            font-weight: 800;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* External Match XP Bar */
        #external-match-xp-bar {
            flex-grow: 1;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 8px;
            padding: 6px 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .xp-bar-label {
            text-align: center;
            margin-bottom: 3px;
        }

        .xp-bar-label span {
            color: #10b981;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            font-family: 'Segoe UI', sans-serif;
        }

        .xp-progress-track {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        #xp-progress-fill {
            height: 100%;
            background: #10b981;
            width: 0%;
            transition: width 0.3s ease;
        }

        canvas { /* HTML5 Canvas game board element styling */
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: block;
            width: 80vw;
            height: 80vw;
            max-width: 420px;
            max-height: 420px;
            margin: 0 auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.05);
        }

        .game-top-bar { /* HUD top bar container above canvas */
            width: 100%;
            padding: 14px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            height: 24px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
        }

        .ai-badge {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            font-size: 10px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
        }

        #shop-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            border: none;
            padding: 9px 16px;
            font-weight: 800;
            font-size: 13px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #shop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }

        #shop-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(19, 27, 46, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.4);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 330px;
            z-index: 20;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 20px rgba(245, 158, 11, 0.15);
            box-sizing: border-box;
            max-height: 80vh;
            overflow-y: auto;
        }
        #shop-modal h3 {
            margin-top: 0;
            color: #f59e0b;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-size: 15px;
            font-weight: 800;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
            background: rgba(15, 23, 42, 0.7);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .shop-item span {
            font-weight: 600;
        }
        .shop-item button {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            font-size: 12px;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        #close-shop {
            width: 100%;
            margin-top: 16px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
        }

        #artillery-card-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(19, 27, 46, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
            z-index: 30;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
            text-align: center;
        }
        #artillery-card-modal h3 {
            margin-top: 0;
            color: #ef4444;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-size: 16px;
            font-weight: 800;
        }
        #artillery-card-modal p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 18px;
        }
        .card-duel-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .duel-card-btn {
            padding: 11px 18px;
            font-weight: 800;
            font-size: 13px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .duel-card-btn.green {
            background: linear-gradient(135deg, #10b981, #059669);
        }
        .duel-card-btn.red {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
    </style>
</head>
<body>

    <div id="game-screen" class="screen active">
        <div class="game-top-bar">
            <div class="brand-container">
                <img src="https://raw.githubusercontent.com/ModernChess/assets-images/main/mchess.png" alt="mchess logo" class="brand-logo" onerror="this.style.display='none'">
                <span class="ai-badge">ai</span>
            </div>
            <button id="shop-btn" onclick="toggleShop()">🛒 Open Shop</button>
        </div>

        <!-- Outer Frame Container for Board & External Elements -->
        <div class="board-outer-frame">
            <!-- External Header Wrapper holding Turn Panel & XP Bar side-by-side outside board -->
            <div class="external-hud-header">
                <div id="external-turn-badge">● TURN: BLUE</div>
                <div id="external-match-xp-bar">
                    <div class="xp-bar-label">
                        <span id="xp-title-text">⚡ BLUE MATCH XP: 0 (LVL 1)</span>
                    </div>
                    <div class="xp-progress-track">
                        <div id="xp-progress-fill" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <canvas id="gameCanvas" width="540" height="540"></canvas>

            <!-- Shop Modal Menu -->
            <div id="shop-modal">
                <h3>Unit Recruitment Shop</h3>
                <div class="shop-item">
                    <span>2x Infantry (1 Gold)</span>
                    <button onclick="buyUnit('infantry')">Buy</button>
                </div>
                <div class="shop-item">
                    <span>1x Tank (1 Gold)</span>
                    <button onclick="buyUnit('tank')">Buy</button>
                </div>
                <div class="shop-item">
                    <span>1x Artillery (2 Gold)</span>
                    <button onclick="buyUnit('artillery')">Buy</button>
                </div>
                <div class="shop-item">
                    <span>1x Ship (2 Gold)</span>
                    <button onclick="buyUnit('ship')">Buy</button>
                </div>
                <button id="close-shop" onclick="toggleShop()">Close Shop</button>
            </div>

            <!-- Artillery Card Duel Modal Menu -->
            <div id="artillery-card-modal">
                <h3 id="duel-modal-title">Artillery Card Duel</h3>
                <p id="duel-modal-desc">Attacker is choosing a card color...</p>
                <div class="card-duel-options" id="duel-button-container">
                    <button class="duel-card-btn green" onclick="attackerChooseCard('green')">Green Card</button>
                    <button class="duel-card-btn red" onclick="attackerChooseCard('red')">Red Card</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log("[INFO][index_html] DOM content fully parsed, initializing UI controller.");

        window.addEventListener('error', function(event) {
            console.error(`[ERROR][global_window] Uncaught error detected: ${event.message} at ${event.filename}:${event.lineno}`);
        });

        window.addEventListener('load', () => {
            console.log("[SUCCESS][index_html] Window fully loaded, all assets and styles initialized.");
        });
    </script>

    <script src="console.js" onerror="console.error('Failed console.js');"></script>
    <script src="map_setup.js" onerror="console.error('Failed map_setup');"></script>
    <script src="team_core.js" onerror="console.error('Failed team_core');"></script>
    <script src="renderer.js" onerror="console.error('Failed renderer.js');"></script>
    <script src="combat_mechanics.js" onerror="console.error('Failed combat_mechanics');"></script>
    <script src="sound.js" onerror="console.error('Failed sound.js');"></script> 
    <script src="unit_movement.js" onerror="console.error('Failed unit_movement');"></script>
    <script src="ailogic.js" onerror="console.error('Failed ailogic.js');"></script>
    <script src="red_bot.js" onerror="console.error('Failed red_bot_2.js');"></script>
    <script src="game.js" onerror="console.error('Failed game.js');"></script>

</body>
</html>
