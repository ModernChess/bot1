<!DOCTYPE html> <!-- Declares document type as HTML5 -->
<html lang="en"> <!-- Root element specifying English language -->
<head> <!-- Head section for page metadata, title, and CSS styles -->
    <meta charset="UTF-8"> <!-- Sets character encoding standard to UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures proper responsive scaling on mobile devices -->
    <title>mchess ai</title> <!-- Title shown on the browser tab -->
    <!-- External Modernized Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-screen" class="screen active">
        <div class="game-top-bar">
            <div class="brand-container">
                <img src="https://raw.githubusercontent.com/ModernChess/assets-images/main/mchess.png" alt="mchess logo" class="brand-logo" onerror="this.style.display='none'">
                <span class="ai-badge">ai</span>
            </div>
            <button id="shop-btn" onclick="toggleShop()">🛒 Open Shop</button>
        </div>

        <!-- Outer Frame Container for Board & External Elements -->
        <div class="board-outer-frame">
            <!-- External Header Wrapper holding Turn Panel & XP Bar side-by-side outside board -->
            <div class="external-hud-header">
                <div id="external-turn-badge">● TURN: BLUE</div>
                <div id="external-match-xp-bar">
                    <div class="xp-bar-label">
                        <span id="xp-title-text">⚡ BLUE MATCH XP: 0 (LVL 1)</span>
                    </div>
                    <div class="xp-progress-track">
                        <div id="xp-progress-fill" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- Canvas with touch-action: none to prevent page panning/zooming interference -->
            <canvas id="gameCanvas" width="540" height="540" style="touch-action: none;"></canvas>

            <!-- Shop Modal Menu -->
            <div id="shop-modal">
                <h3>Unit Recruitment Shop</h3>
                <div class="shop-item">
                    <span>2x Infantry (1 Gold)</span>
                    <button onclick="buyUnit('infantry')">Buy</button>
                </div>
                <div class="shop-item">
                    <span>1x Tank (1 Gold)</span>
                    <button onclick="buyUnit('tank')">Buy</button>
                </div>
                <div class="shop-item">
                    <span>1x Artillery (2 Gold)</span>
                    <button onclick="buyUnit('artillery')">Buy</button>
                </div>
                <div class="shop-item">
                    <span>1x Ship (2 Gold)</span>
                    <button onclick="buyUnit('ship')">Buy</button>
                </div>
                <button id="close-shop" onclick="toggleShop()">Close Shop</button>
            </div>

            <!-- Artillery Card Duel Modal Menu -->
            <div id="artillery-card-modal">
                <h3 id="duel-modal-title">Artillery Card Duel</h3>
                <p id="duel-modal-desc">Attacker is choosing a card color...</p>
                <div class="card-duel-options" id="duel-button-container">
                    <button class="duel-card-btn green" onclick="attackerChooseCard('green')">Green Card</button>
                    <button class="duel-card-btn red" onclick="attackerChooseCard('red')">Red Card</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log("[INFO][index_html] DOM content fully parsed, initializing UI controller.");

        window.addEventListener('error', function(event) {
            console.error(`[ERROR][global_window] Uncaught error detected: ${event.message} at ${event.filename}:${event.lineno}`);
        });

        window.addEventListener('load', () => {
            console.log("[SUCCESS][index_html] Window fully loaded, all assets and styles initialized.");
        });
    </script>

    <script src="console.js" onerror="console.error('Failed console.js');"></script>
    <script src="map_setup.js" onerror="console.error('Failed map_setup');"></script>
    <script src="team_core.js" onerror="console.error('Failed team_core');"></script>
    <script src="renderer.js" onerror="console.error('Failed renderer.js');"></script>
    <script src="combat_mechanics.js" onerror="console.error('Failed combat_mechanics');"></script>
    <script src="sound.js" onerror="console.error('Failed sound.js');"></script> 
    
    <!-- Viewport controller initialization -->
    <script type="module">
        import { initViewportControls } from './viewport.js';
        const canvas = document.getElementById('gameCanvas');
        if (canvas) {
            initViewportControls(canvas, () => {});
        }
    </script>

    <!-- unit_movement.js loaded with type="module" to support imports -->
    <script type="module" src="unit_movement.js" onerror="console.error('Failed unit_movement');"></script>
    
    <!-- Loads the Tutorial Guide & Chat Cloud UI controller -->
    <script src="tutorial_guide.js" onerror="console.error('Failed tutorial_guide.js');"></script>

    <script src="ailogic.js" onerror="console.error('Failed ailogic.js');"></script>
    <script src="red_bot.js" onerror="console.error('Failed red_bot_2.js');"></script>
    
    <!-- Load level data definitions first -->
    <script src="info.js" onerror="console.error('Failed info.js');"></script>
    <!-- Load game core UI & profile logic -->
    <script src="game.js" onerror="console.error('Failed game.js');"></script>
    <!-- Load gamelogic handlers last -->
    <script src="gamelogic.js" onerror="console.error('Failed gamelogic.js');"></script>

</body>
</html>
