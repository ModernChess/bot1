<!DOCTYPE html> <!-- Declares document type as HTML5 -->
<html lang="en"> <!-- Root element specifying English language -->
<head> <!-- Head section for page metadata, title, and CSS styles -->
    <meta charset="UTF-8"> <!-- Sets character encoding standard to UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures proper responsive scaling on mobile devices -->
    <title>mchess ai</title> <!-- Title shown on the browser tab -->
    <style>
        :root { /* Defines global CSS variable color themes */
            --bg-color: #0b0f19; /* Deep futuristic dark background fill */
            --panel-bg: #131b2e; /* Dark slate panel container background */
            --border-color: #1e293b; /* Standard border line outline color */
            --accent-green: #10b981; /* Neon green highlight for confirm actions */
            --accent-blue: #3b82f6; /* Electric blue highlight color */
            --accent-gold: #f59e0b; /* Golden shop button color */
            --text-main: #f8fafc; /* Primary bright white text color */
            --text-muted: #94a3b8; /* Subdued gray-blue text color */
        }

        body { /* Global body element style layout rules */
            margin: 0;
            background: radial-gradient(circle at center, #1e293b 0%, var(--bg-color) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto; /* Allows safe scrolling if zoomed in */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
            color: var(--text-main);
            padding: 10px;
            box-sizing: border-box;
        }

        .screen { /* Container layout class for each app screen view */
            display: none; /* Hides all screens by default */
            width: 100%;
            max-width: 540px;
            min-height: 90vh;
            max-height: 95vh;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            overflow-y: auto; /* Prevents button clipping during zoom-ins */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .screen.active { /* Makes the target screen visible when active */
            display: flex;
        }

        #game-screen { /* Game screen specific container layout */
            align-items: center;
            justify-content: flex-start;
        }

        canvas { /* HTML5 Canvas game board element styling */
            background: #111827;
            border: 2px solid #374151;
            border-radius: 8px;
            display: block;
            width: 80vw;
            height: 80vw;
            max-width: 420px;
            max-height: 420px;
            margin: 10px auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .game-top-bar { /* HUD top bar container above the canvas */
            width: 100%;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        /* Stylised Logo & AI Badge Section */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo {
            height: 22px; /* Matches the text-height size from earlier */
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .ai-badge {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        /* Shop UI Button & Modal Styles */
        #shop-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            border: none;
            padding: 8px 14px;
            font-weight: 800;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            transition: all 0.2s ease;
        }
        #shop-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
        }

        #shop-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            border: 2px solid #f59e0b;
            padding: 20px;
            border-radius: 14px;
            width: 90%;
            max-width: 320px;
            z-index: 20;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
            max-height: 80vh;
            overflow-y: auto;
        }
        #shop-modal h3 {
            margin-top: 0;
            color: #f59e0b;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 15px;
            font-weight: 800;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }
        .shop-item span {
            font-weight: 500;
        }
        .shop-item button {
            background-color: var(--accent-green);
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 800;
            font-size: 12px;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .shop-item button:hover {
            background-color: #34d399;
        }
        #close-shop {
            width: 100%;
            margin-top: 14px;
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
        }
        #close-shop:hover {
            background-color: #dc2626;
        }

        /* Artillery Card Duel Modal Styles */
        #artillery-card-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            border: 2px solid #ef4444;
            padding: 20px;
            border-radius: 14px;
            width: 90%;
            max-width: 320px;
            z-index: 30;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
            text-align: center;
        }
        #artillery-card-modal h3 {
            margin-top: 0;
            color: #ef4444;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 16px;
            font-weight: 800;
        }
        #artillery-card-modal p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 15px;
        }
        .card-duel-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .duel-card-btn {
            padding: 10px 16px;
            font-weight: 800;
            font-size: 13px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
            transition: transform 0.1s;
        }
        .duel-card-btn:active {
            transform: scale(0.96);
        }
        .duel-card-btn.green {
            background-color: #10b981;
        }
        .duel-card-btn.red {
            background-color: #ef4444;
        }
    </style>
</head>
<body> <!-- Document body containing all UI screen views -->

    <!-- Active Match Gameplay Screen View (Direct Load) -->
    <div id="game-screen" class="screen active">
        <div class="game-top-bar">
            <div class="brand-container">
                <img src="https://raw.githubusercontent.com/ModernChess/assets-images/main/mchess.png" alt="mchess logo" class="brand-logo" onerror="this.style.display='none'">
                <span class="ai-badge">ai</span>
            </div>
            <button id="shop-btn" onclick="toggleShop()">🛒 Open Shop</button>
        </div>
        <div style="display:flex; justify-content:center; align-items:center; flex-grow:1; position:relative; width: 100%;">
            <canvas id="gameCanvas" width="540" height="540"></canvas>

            <!-- Shop Modal Menu -->
            <div id="shop-modal">
                <h3>Unit Recruitment Shop</h3>
                <div class="shop-item">
                    <span>2x Infantry (1 Gold)</span>
                    <button onclick="buyUnit('infantry')">Buy</button>
                </div>
                <div class="shop-item">
                    <span>1x Tank (1 Gold)</span>
                    <button onclick="buyUnit('tank')">Buy</button>
                </div>
                <div class="shop-item">
                    <span>1x Artillery (2 Gold)</span>
                    <button onclick="buyUnit('artillery')">Buy</button>
                </div>
                <div class="shop-item">
                    <span>1x Ship (2 Gold)</span>
                    <button onclick="buyUnit('ship')">Buy</button>
                </div>
                <button id="close-shop" onclick="toggleShop()">Close Shop</button>
            </div>

            <!-- Artillery Card Duel Modal Menu -->
            <div id="artillery-card-modal">
                <h3 id="duel-modal-title">Artillery Card Duel</h3>
                <p id="duel-modal-desc">Attacker is choosing a card color...</p>
                <div class="card-duel-options" id="duel-button-container">
                    <button class="duel-card-btn green" onclick="attackerChooseCard('green')">Green Card</button>
                    <button class="duel-card-btn red" onclick="attackerChooseCard('red')">Red Card</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Screen Navigation Controller Script -->
    <script>
        console.log("[INFO][index_html] DOM content fully parsed, initializing UI controller.");

        // Global window error listener for robust client-side error tracing and chat box parsing
        window.addEventListener('error', function(event) {
            console.error(`[ERROR][global_window] Uncaught error detected: ${event.message} at ${event.filename}:${event.lineno}`);
        });

        window.addEventListener('load', () => {
            console.log("[SUCCESS][index_html] Window fully loaded, all assets and styles initialized.");
        });
    </script>

    <!-- REQUIRED SCRIPT LOAD ORDER (console.js excluded) -->
    <script src="map_setup.js" onerror="console.error('[ERROR][index_html] Failed to load script: map_setup.js');"></script>
    <script src="team_core.js" onerror="console.error('[ERROR][index_html] Failed to load script: team_core.js');"></script>
    <script src="combat_mechanics.js" onerror="console.error('[ERROR][index_html] Failed to load script: combat_mechanics.js');"></script>
    <script src="unit_movement.js" onerror="console.error('[ERROR][index_html] Failed to load script: unit_movement.js');"></script>
    <script src="red_bot.js" onerror="console.error('[ERROR][index_html] Failed to load script: red_bot.js');"></script>
</body>
</html>
